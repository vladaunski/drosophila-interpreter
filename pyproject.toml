[project]
name = "drosophila-interpreter"
version = "0.1.0"
description = "Fly brain interpreter"
readme = "README.md"
authors = [
    { name = "vladaunski", email = "112953613+vladaunski@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "sentence-transformers>=6.0.1",
    "torch>=2.14.0",
]

[project.scripts]
drosophila-interpreter = "drosophila_interpreter:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88